name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build valgrind cppcheck clang-tidy
      - run: ./ci/check.sh
